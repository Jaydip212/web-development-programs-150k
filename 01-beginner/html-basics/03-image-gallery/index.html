<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery - Jayvik Labs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0f0f0f;
            color: white;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border-radius: 15px;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .gallery-item:hover {
            transform: translateY(-10px);
        }

        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .gallery-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover .gallery-overlay {
            transform: translateY(0);
        }

        .gallery-overlay h3 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .gallery-overlay p {
            font-size: 14px;
            opacity: 0.8;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #999;
        }

        footer strong {
            color: #ff6b6b;
        }
    </style>
</head>

<body>
    <header>
        <h1>📸 Photo Gallery</h1>
        <p>Beautiful Moments Captured</p>
    </header>

    <div class="gallery">
        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=500" alt="Mountain">
            <div class="gallery-overlay">
                <h3>Mountain Peak</h3>
                <p>Breathtaking mountain views</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500" alt="Beach">
            <div class="gallery-overlay">
                <h3>Tropical Beach</h3>
                <p>Paradise on earth</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1511593358241-7eea1f3c84e5?w=500" alt="City">
            <div class="gallery-overlay">
                <h3>City Lights</h3>
                <p>Urban nightscape</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500" alt="Nature">
            <div class="gallery-overlay">
                <h3>Forest Trail</h3>
                <p>Into the wilderness</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500" alt="Landscape">
            <div class="gallery-overlay">
                <h3>Golden Hour</h3>
                <p>Sunset landscape</p>
            </div>
        </div>

        <div class="gallery-item">
            <img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=500" alt="Adventure">
            <div class="gallery-overlay">
                <h3>Adventure Awaits</h3>
                <p>Explore the unknown</p>
            </div>
        </div>
    </div>

    <footer>
        <p>Created with ❤️ by <strong>Jayvik Labs - Jaydip</strong></p>
    </footer>
</body>

</html>
