<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile - Jayvik Labs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .profile-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }
        
        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 48px;
            color: white;
            font-weight: bold;
        }
        
        .profile-header h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .profile-header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }
        
        .profile-body {
            padding: 30px;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .info-item:last-child {
            border-bottom: none;
        }
        
        .info-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            margin-right: 15px;
        }
        
        .info-content h3 {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        
        .info-content p {
            font-size: 16px;
            color: #333;
            font-weight: 500;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: transform 0.3s ease;
        }
        
        .social-btn:hover {
            transform: translateY(-5px);
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 14px;
        }
        
        .footer strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-image">JL</div>
            <h1>Jaydip Jadhav</h1>
            <p>Full Stack Developer</p>
        </div>
        
        <!-- Profile Body -->
        <div class="profile-body">
            <div class="info-item">
                <div class="info-icon">📧</div>
                <div class="info-content">
                    <h3>Email</h3>
                    <p>jaydip@jayviklabs.com</p>
                </div>
            </div>
            
            <div class="info-item">
                <div class="info-icon">📱</div>
                <div class="info-content">
                    <h3>Phone</h3>
                    <p>+91 98765 43210</p>
                </div>
            </div>
            
            <div class="info-item">
                <div class="info-icon">📍</div>
                <div class="info-content">
                    <h3>Location</h3>
                    <p>Mumbai, India</p>
                </div>
            </div>
            
            <div class="info-item">
                <div class="info-icon">💼</div>
                <div class="info-content">
                    <h3>Company</h3>
                    <p>Jayvik Labs</p>
                </div>
            </div>
            
            <!-- Social Links -->
            <div class="social-links">
                <a href="#" class="social-btn">🔗</a>
                <a href="#" class="social-btn">💼</a>
                <a href="#" class="social-btn">🐙</a>
                <a href="#" class="social-btn">🐦</a>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            Created by <strong>Jayvik Labs - Jaydip</strong>
        </div>
    </div>
</body>
</html>
