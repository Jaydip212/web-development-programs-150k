<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tool V1010 - Jayvik Labs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
        }
        p { color: #666; text-align: center; font-size: 16px; }
        footer { text-align: center; margin-top: 30px; color: #666; font-size: 14px; }
        footer strong { color: #f7971e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Image Tool V1010</h1>
        <p>Program #144010 - Gold Theme</p>
        <footer><p>Created by <strong>Jayvik Labs - Jaydip</strong></p></footer>
    </div>
</body>
</html>
