<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Animations - Jayvik Labs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .animation-container {
            text-align: center;
        }
        h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .demo-box {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto;
            border-radius: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        footer {
            position: absolute;
            bottom: 20px;
            color: #666;
            font-size: 14px;
        }
        footer strong { color: #667eea; }
    </style>
</head>
<body>
    <div class="animation-container">
        <h1>SVG Animations</h1>
        <div class="demo-box"></div>
    </div>
    <footer>
        <p>Created by <strong>Jayvik Labs - Jaydip</strong></p>
    </footer>
</body>
</html>
